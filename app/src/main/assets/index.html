<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Windows 11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- صفحه دسکتاپ -->
    <div id="desktop" onclick="closeStartMenu()">
        <div class="desktop-icons">
            <div class="icon" ondblclick="openExplorer('/storage/emulated/0')">
                <div class="icon-img">💻</div>
                <span>This PC</span>
            </div>
            <div class="icon" ondblclick="openExplorer('/storage/emulated/0/Download')">
                <div class="icon-img">📁</div>
                <span>Downloads</span>
            </div>
            <div class="icon" onclick="openX11()">
                <div class="icon-img">🖥️</div>
                <span>Wine X11 Display</span>
            </div>
        </div>

        <!-- پنجره File Explorer -->
        <div id="explorer-window" class="window hidden">
            <div class="title-bar" id="explorer-header">
                <div class="title">📁 File Explorer - <span id="current-path">/storage/emulated/0</span></div>
                <div class="window-controls">
                    <button onclick="goBackDir()">⬅️</button>
                    <button class="close-btn" onclick="closeWindow('explorer-window')">✕</button>
                </div>
            </div>
            <div class="window-body" id="file-list">
                <!-- لیست فایل‌های واقعی گوشی اینجا لود می‌شود -->
            </div>
        </div>
    </div>

    <!-- منوی استارت ویندوز ۱۱ -->
    <div id="start-menu" class="glass hidden">
        <div class="search-box">
            <input type="text" placeholder="Type here to search..." id="search-input" onkeyup="filterApps()">
        </div>
        <div class="pinned-title">Pinned</div>
        <div class="pinned-grid">
            <div class="app-item" onclick="openExplorer('/storage/emulated/0'); closeStartMenu()">
                <span>📁</span><p>File Explorer</p>
            </div>
            <div class="app-item" onclick="openExplorer('/storage/emulated/0/Download'); closeStartMenu()">
                <span>🎮</span><p>Games (.exe)</p>
            </div>
            <div class="app-item" onclick="openX11(); closeStartMenu()">
                <span>⚡</span><p>X11 Server</p>
            </div>
        </div>
        <div class="start-footer">
            <span>👤 Administrator</span>
            <button onclick="location.reload()">🔄 Restart UI</button>
        </div>
    </div>

    <!-- تسک‌بار شیشه‌ای وسط‌چین ویندوز ۱۱ -->
    <div id="taskbar" class="glass">
        <div class="taskbar-center">
            <button class="tb-btn start-btn" onclick="toggleStartMenu(event)">⊞</button>
            <button class="tb-btn" onclick="openExplorer('/storage/emulated/0')">📁</button>
            <button class="tb-btn" onclick="openX11()">🖥️</button>
        </div>
        <div class="taskbar-right">
            <div id="clock">12:00 PM</div>
        </div>
    </div>

    <script src="desktop.js"></script>
</body>
</html>
